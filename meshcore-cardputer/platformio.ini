; MeshCore board definition for M5Stack Cardputer ADV + Cap LoRa-1262.
;
; INSTALL: this file must live at <your meshcore checkout>/variants/cardputer_adv/platformio.ini
; (with CardputerAdvBoard.{h,cpp}, target.{h,cpp}, board_pins_cardputer_adv.h, dualmesh_ota.h,
; and partitions_dualmesh.csv all copied alongside it in that same directory) so PlatformIO's
; `extra_configs = variants/*/platformio.ini` glob in the repo's root platformio.ini picks it up,
; `extends = esp32_base` resolves, and this file's root-relative -I/-include/board_build.partitions
; paths line up. See ../README.md "Building" for the exact copy commands and the three required
; upstream patches (0001, 0002, 0003).
;
; Modeled directly on the upstream `[LilyGo_TDeck]` base + `Heltec_v3`-style companion_radio
; envs — MeshCore's own T-Deck board (the only other keyboard+color-TFT+LoRa board upstream)
; only ships Companion Radio, repeater, and kiss_modem builds, not an on-device chat UI, even
; though it has a keyboard — this firmware follows that same, better-supported path rather than
; inventing new on-device chat UI code against an interface this repo doesn't document a
; contract for. Companion Radio also happens to be MeshCore's most fully-featured mode (full
; protocol support, official iOS/Android/web app pairing over BLE or USB) — the "as powerful as
; possible" choice, not just the easy one.

[CardputerAdv]
extends = esp32_base
board = m5stack-stamps3
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/cardputer_adv          ; also holds board_pins_cardputer_adv.h + dualmesh_ota.h,
                                      ; copied in alongside — see README.md "Building". dualmesh_ota.h
                                      ; is included explicitly by 0001-add-return-to-launcher-hook.patch
                                      ; in examples/companion_radio/main.cpp, NOT force-included here
                                      ; via -include: a project-wide -include flag gets injected into
                                      ; every translation unit PlatformIO compiles for this target,
                                      ; including plain-C/framework-internal files that don't have
                                      ; Arduino.h on their include path, which fails to compile
                                      ; (dualmesh_ota.h needs <Arduino.h> and uses C++ namespaces).
  -D M5_CARDPUTER_ADV=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=1
  -D BOARD_HAS_PSRAM=1
  -D PIN_USER_BTN=0
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22               ; SX1262 hardware ceiling; MeshCore clamps to whatever the
                                     ; regulatory preset you actually configure allows — see
                                     ; README.md "RF power & regulatory compliance"
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D P_LORA_NSS=5
  -D P_LORA_RESET=3
  -D P_LORA_BUSY=6
  -D P_LORA_DIO_1=4
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=39
  -D P_LORA_MOSI=14
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D DISPLAY_WIDTH=240              ; requires patch 0002 (ST7789LCDDisplay hardcodes 240x320
  -D DISPLAY_HEIGHT=135             ; otherwise) — Cardputer ADV's real panel is 240x135
  -D DISPLAY_ROTATION=1
  -D DISPLAY_SCALE_X=1.875          ; 240 / 128 logical grid width
  -D DISPLAY_SCALE_Y=2.109          ; 135 / 64  logical grid height
  -D PIN_TFT_CS=37
  -D PIN_TFT_DC=34
  -D PIN_TFT_RST=33
  -D PIN_TFT_SCL=36
  -D PIN_TFT_SDA=35
  -D PIN_TFT_MISO=-1
  -D PIN_TFT_LEDA_CTL=38
  -D PIN_TFT_VDD_CTL=-1
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_RX=15
  -D PIN_GPS_TX=13
  -D GPS_BAUD_RATE=115200
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
board_build.partitions = variants/cardputer_adv/partitions_dualmesh.csv
board_build.filesystem = spiffs
board_build.app_partition_name = ota_1     ; NOTE: only respected by newer platform-espressif32
                                            ; releases; flash_all.sh does not rely on this and
                                            ; sets the real 0x5B0000 offset explicitly regardless.
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/cardputer_adv>
  +<helpers/sensors/*.cpp>
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

; Bluetooth companion — pair with the official MeshCore app over BLE. This is the primary,
; recommended build: full protocol feature set, no cable needed day-to-day.
[env:cardputer_adv_companion_radio_ble]
extends = CardputerAdv
build_flags =
  ${CardputerAdv.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${CardputerAdv.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${CardputerAdv.lib_deps}
  densaugeo/base64 @ ~1.4.0

; USB-serial companion — same firmware personality, wired pairing instead of BLE. Useful for
; a fixed base-station role or if you'd rather not run BLE.
[env:cardputer_adv_companion_radio_usb]
extends = CardputerAdv
build_flags =
  ${CardputerAdv.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
build_src_filter = ${CardputerAdv.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${CardputerAdv.lib_deps}
  densaugeo/base64 @ ~1.4.0
